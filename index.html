<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador Cloud Practitioner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: estudio enfocado, claro y alentador, como una plataforma de formación en la nube.
IDEA: la tarjeta de pregunta de un curso de práctica tipo Skill Builder.
PICTURE: la propia tarjeta de pregunta con opciones grandes y la retroalimentación.
COLOUR and TYPE: barra azul marino, acento naranja, tarjetas blancas; Inter.
LAYOUT: una columna centrada de 760px, barra de progreso arriba, tarjeta, acciones abajo.
*/
:root{color-scheme:light dark;
--bg:light-dark(#f2f3f3,#0f1418);--card:light-dark(#ffffff,#1a2129);--ink:light-dark(#16191f,#e9edf1);
--mute:light-dark(#5f6b7a,#9aa6b2);--line:light-dark(#d5dbdb,#2c3742);--nav:#232f3e;--acc:#ff9900;--acc2:light-dark(#ec7211,#ffac31);
--ok:light-dark(#037f0c,#5fd36a);--okbg:light-dark(#f2fcf3,#0f2a14);--bad:light-dark(#d13212,#ff7a5c);--badbg:light-dark(#fff7f5,#2d1410);
--sel:light-dark(#f1faff,#10283a);--selb:light-dark(#0073bb,#4fb3f0)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
header{background:var(--nav);color:#fff;padding:14px max(5vw,16px);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header .logo{width:34px;height:34px;border-radius:8px;background:var(--acc);display:grid;place-items:center;color:var(--nav);font-weight:700}
header b{font-size:17px}header span{color:#c6ccd3;font-size:14px;margin-left:auto}
main{max-width:760px;margin:0 auto;padding:clamp(20px,4vw,40px) 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:clamp(20px,4vw,34px)}
h1{font-size:clamp(28px,5vw,40px);line-height:1.1;margin:0 0 10px;text-wrap:balance}
h2{font-size:clamp(19px,3vw,22px);line-height:1.35;margin:6px 0 20px;font-weight:600;text-wrap:pretty}
.mute{color:var(--mute)}
.btn{font:600 16px Inter,sans-serif;border-radius:22px;padding:11px 26px;min-height:44px;border:2px solid transparent;cursor:pointer;background:var(--acc);color:#16191f}
.btn:hover{filter:brightness(1.05)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sec{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:focus-visible,.opt:focus-within{outline:3px solid var(--selb);outline-offset:2px}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--mute);margin-bottom:8px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s}
.tag{display:inline-block;font-size:13px;font-weight:600;background:var(--sel);color:var(--selb);padding:3px 10px;border-radius:12px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:10px;padding:13px 15px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--selb)}
.opt input{margin:4px 0 0;width:18px;height:18px;accent-color:var(--selb);flex:none}
.opt .l{font-weight:700;color:var(--mute);flex:none;width:18px}
.opt.on{border-color:var(--selb);background:var(--sel)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.locked .opt{cursor:default}
.fb{margin-top:20px;border-radius:10px;padding:16px 18px;border-left:6px solid}
.fb.ok{background:var(--okbg);border-color:var(--ok)}.fb.no{background:var(--badbg);border-color:var(--bad)}
.fb strong{display:block;font-size:18px;margin-bottom:4px}.fb.ok strong{color:var(--ok)}.fb.no strong{color:var(--bad)}
.fb p{margin:6px 0 0}
.act{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;flex-wrap:wrap}
.score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center;margin:18px 0 8px}
.ring{width:170px;height:170px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0)}
.ring div{width:132px;height:132px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center}
.ring b{font-size:44px;line-height:1}.ring small{color:var(--mute);font-size:14px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.stats div{border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:14px}
.stats b{display:block;font-size:20px}
.rev{margin-top:28px}.rev h3{font-size:18px;margin:0 0 12px}
.ri{border-top:1px solid var(--line);padding:14px 0}.ri p{margin:4px 0}
.ri .q{font-weight:600}.ri .y{color:var(--bad)}.ri .c{color:var(--ok)}
.set{display:grid;gap:14px;margin:0 0 22px;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.set label{display:grid;gap:6px;font-weight:600;font-size:15px}
.set input,.set select{font:16px Inter,sans-serif;padding:10px 12px;min-height:44px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
ul.rules{padding-left:20px;margin:14px 0 22px}ul.rules li{margin:4px 0}
.vt{margin-left:auto;font:600 14px Inter,sans-serif;background:transparent;color:#fff;border:1.5px solid #5a6b7d;border-radius:18px;padding:7px 14px;min-height:40px;cursor:pointer}
.vt[aria-pressed=true]{border-color:var(--acc);color:var(--acc)}
.va{display:flex;gap:14px;align-items:center;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);flex-wrap:wrap}
.av{width:52px;height:52px;border-radius:50%;background:var(--nav);display:grid;place-items:center;flex:none;position:relative}
.av svg{width:30px;height:30px}
.av::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:3px solid var(--acc);opacity:0}
.talk .av::after{animation:pulse 1.1s ease-out infinite}
@keyframes pulse{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.25);opacity:0}}
.va .msg{flex:1;min-width:180px;font-size:15px}
.va .msg b{display:block}
.vb{font:600 14px Inter,sans-serif;border-radius:18px;padding:8px 14px;min-height:40px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
@media(max-width:600px){.score{grid-template-columns:1fr;justify-items:center;text-align:center}.stats{justify-content:center}.act .btn{flex:1}header span{margin-left:0;width:100%}.vt{margin-left:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.section{margin-top:24px}progress{width:100%;height:12px;accent-color:var(--acc);margin-bottom:18px}.questionGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:8px}.navq,.historyRow{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;min-height:44px;padding:8px;cursor:pointer}.navq.current{border:3px solid var(--selb);background:var(--sel)}.history{display:grid;gap:8px;max-height:350px;overflow:auto}.historyRow{text-align:left;display:grid;gap:3px}.historyRow span{font-size:13px;color:var(--mute)}details{margin-top:16px}summary{cursor:pointer;font-weight:600;padding:10px 0}.tableWrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}td,th{padding:10px;border-bottom:1px solid var(--line)}footer{padding:16px;text-align:center;color:var(--mute);font-size:13px}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--selb);outline-offset:3px}h1:focus,h2:focus{outline:none}#reviewFilter{padding:8px;background:var(--card);color:var(--ink);max-width:100%}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><div class="logo">☁</div><b>Simulador Cloud Practitioner</b><span>Práctica y examen</span><button class="vt" id="vt" aria-pressed="true">🔊 Asistente de voz: activado</button></header>
<main id="app"></main><footer id="storage" role="status"></footer>
<script>
{
const Q=[
{t:"Una compañía necesita contratar consultores externos para ayudar a mantener y dar soporte a su entorno de AWS y a sus necesidades empresariales. ¿Qué servicio o recurso de AWS satisfará estos requisitos?",o:["Soporte de AWS","AWS Organizations","Catálogo de servicios de AWS","Red de socios de AWS (APN)"],a:[3],e:"La AWS Partner Network (APN) agrupa a consultores y empresas externas certificadas que ayudan a diseñar, migrar y operar entornos de AWS. AWS Support es el soporte técnico de AWS mismo, no consultores externos."},
{t:"¿Qué servicios de AWS utilizan ubicaciones de borde globales? (Seleccione DOS.)",o:["AWS Fargate","Amazon CloudFront","AWS Global Accelerator","AWS Wavelength","Amazon VPC"],a:[1,2],e:"CloudFront (CDN) almacena contenido en caché en las ubicaciones de borde, y Global Accelerator usa la red de borde de AWS para dirigir el tráfico por la ruta óptima. Wavelength usa zonas en redes 5G de operadores, no ubicaciones de borde."},
{t:"Según el modelo de responsabilidad compartida de AWS, ¿quién es responsable de la capa de virtualización hasta la seguridad física de las instalaciones en las que operan los servicios de AWS?",o:["Es responsabilidad exclusiva del cliente","Es responsabilidad exclusiva de AWS","Es una responsabilidad compartida entre AWS y el cliente","Es responsabilidad del socio de AWS que gestiona la cuenta"],a:[1],e:"AWS es responsable de la seguridad DE la nube: hardware, hipervisor/virtualización, red física e instalaciones. El cliente es responsable de la seguridad EN la nube (datos, SO invitado, configuración)."},
{t:"¿Qué beneficio de AWS demuestran los servicios tecnológicos bajo demanda que permiten a las empresas sustituir los gastos fijos iniciales por gastos variables?",o:["Alta disponibilidad","Economías de escala","Pago por uso","Alcance mundial"],a:[2],e:"El pago por uso (pay-as-you-go) cambia el gasto de capital (CapEx) por gasto variable (OpEx): solo pagas lo que consumes. Las economías de escala se refieren a precios más bajos gracias al volumen agregado de AWS."},
{t:"Una empresa quiere un servicio totalmente gestionado que pueda transferir datos de streaming desde múltiples fuentes a un bucket de Amazon S3. ¿Qué servicio debería utilizar?",o:["AWS DataSync","Amazon Kinesis Data Firehose","S3 Select","AWS Transfer Family"],a:[1],e:"Kinesis Data Firehose captura datos de streaming y los entrega automáticamente a destinos como S3, Redshift u OpenSearch. DataSync transfiere archivos (no streaming) y Transfer Family es para SFTP/FTP."},
{t:"¿Qué servicio de AWS es una solución de entrega y despliegue continuos?",o:["AWS AppSync","AWS CodePipeline","AWS Cloud9","AWS CodeArtifact"],a:[1],e:"CodePipeline orquesta el flujo de CI/CD (compilar, probar, desplegar) de forma automática. AppSync es para APIs GraphQL, Cloud9 es un IDE en la nube y CodeArtifact es un repositorio de paquetes."},
{t:"¿Qué afirmación describe mejor la infraestructura global de AWS?",o:["La infraestructura de AWS es un único centro de datos de gran tamaño replicado en cada país","La infraestructura de AWS consta de subredes que contienen varias zonas de disponibilidad con varios centros de datos situados en la misma ubicación geográfica","AWS permite a los usuarios elegir Regiones de AWS y centros de datos para que puedan seleccionar los centros de datos más cercanos en diferentes Regiones","La infraestructura de AWS se compone de Regiones aisladas con zonas de disponibilidad independientes conectadas mediante redes de baja latencia y fuentes de alimentación redundantes"],a:[3],e:"Cada Región está aislada y contiene varias zonas de disponibilidad (AZ) independientes, con energía redundante y conectadas por redes de baja latencia. Los clientes eligen Región y AZ, pero no centros de datos específicos."},
{t:"¿Cuál de los siguientes es un componente de la infraestructura global de AWS?",o:["Amazon Alexa","Regiones de AWS","Amazon Lightsail","AWS Organizations"],a:[1],e:"La infraestructura global se compone de Regiones, zonas de disponibilidad, ubicaciones de borde, Local Zones, etc. Lightsail y Organizations son servicios, no componentes de infraestructura."},
{t:"¿Qué servicio de AWS proporciona recomendaciones inteligentes para mejorar la calidad del código e identificar las líneas de código más costosas de una aplicación?",o:["Amazon CodeGuru","AWS CodeStar","AWS CodeCommit","AWS CodeDeploy"],a:[0],e:"Amazon CodeGuru usa machine learning: CodeGuru Reviewer revisa calidad del código y CodeGuru Profiler identifica las líneas más costosas en rendimiento y costo."},
{t:"¿Cuál de las siguientes es una base de datos totalmente gestionada compatible con MySQL?",o:["Amazon S3","Amazon DynamoDB","Amazon Redshift","Amazon Aurora"],a:[3],e:"Amazon Aurora es una base de datos relacional gestionada compatible con MySQL y PostgreSQL. DynamoDB es NoSQL, Redshift es data warehouse y S3 es almacenamiento de objetos."},
{t:"Un equipo de desarrollo desea implementar varios entornos de prueba para una aplicación de forma rápida y repetible. ¿Qué servicio de AWS debería utilizar?",o:["Amazon EC2","AWS CloudFormation","Amazon QuickSight","Amazon ECS"],a:[1],e:"CloudFormation es infraestructura como código: defines los recursos en una plantilla y puedes crear entornos idénticos una y otra vez de forma automática."},
{t:"Una compañía necesita un servicio de base de datos de grafos que sea escalable y altamente disponible. ¿Qué servicio de AWS cumple estos requisitos?",o:["Amazon Aurora","Amazon Redshift","Amazon DynamoDB","Amazon Neptune"],a:[3],e:"Amazon Neptune es la base de datos de grafos gestionada de AWS (relaciones entre nodos, redes sociales, recomendaciones, detección de fraude)."},
{t:"Una compañía está considerando cambiar de AWS Business Support a AWS Enterprise Support. ¿Qué beneficio adicional recibirá?",o:["Un conjunto completo de comprobaciones de AWS Trusted Advisor","Acceso telefónico, por correo y chat a ingenieros de soporte 24/7","Un gestor técnico de cuentas (TAM) designado para ayudar en la supervisión y optimización"],a:[2],e:"El TAM designado es exclusivo de Enterprise Support. Business ya incluye todas las comprobaciones de Trusted Advisor y acceso 24/7 a ingenieros por teléfono, correo y chat."},
{t:"Una empresa quiere minimizar la latencia y realizar operaciones de computación para su aplicación web lo más cerca posible de los usuarios finales. ¿Qué servicio o componente de infraestructura proporcionará esta funcionalidad?",o:["Regiones de AWS","Zonas de disponibilidad","Ubicaciones de borde","AWS Direct Connect"],a:[2],e:"Las ubicaciones de borde están distribuidas cerca de los usuarios finales; con CloudFront y Lambda@Edge/CloudFront Functions puedes ejecutar cómputo allí y reducir la latencia."},
{t:"¿Qué servicios de AWS puede utilizar una empresa para transferir datos on-premise a la nube de AWS? (Seleccione DOS.)",o:["AWS Snowcone","AWS Transit Gateway","AWS DataSync","AWS Backup","Amazon Connect"],a:[0,2],e:"Snowcone es un dispositivo físico de la familia Snow para mover datos, y DataSync transfiere datos en línea de forma automatizada. Transit Gateway conecta redes, Backup respalda recursos y Connect es un centro de contacto."},
{t:"¿Cuál de las siguientes es una ventaja que la nube de AWS proporciona a los usuarios?",o:["Los usuarios no tienen que adivinar los requisitos de capacidad de la infraestructura","Los usuarios reducen sus costes variables al mantener la propiedad exclusiva del hardware","Los usuarios mantienen el control del hardware de la infraestructura subyacente","Los usuarios mantienen el control del sistema operativo para los servicios administrados"],a:[0],e:"'Dejar de adivinar la capacidad' es una de las seis ventajas de la nube: escalas hacia arriba o abajo según la demanda real. El hardware y el SO de servicios administrados los controla AWS."},
{t:"Una empresa desea comprometerse por adelantado al uso continuado de sus instancias EC2 de producción a cambio de un coste reducido. ¿Qué opciones de precios cumplen estos requisitos con el menor coste? (Seleccione DOS.)",o:["Instancias Spot","Instancias bajo demanda","Instancias reservadas","Savings Plans","Hosts dedicados"],a:[2,3],e:"Instancias reservadas y Savings Plans ofrecen grandes descuentos a cambio de un compromiso de 1 o 3 años. Spot es barato pero no implica compromiso y puede interrumpirse."},
{t:"Una empresa administra una base de datos MySQL on-premise en un servidor Windows y quiere migrarla a AWS reduciendo la sobrecarga administrativa. ¿Qué servicio cumplirá este requisito?",o:["Amazon Redshift","Amazon ElastiCache","Amazon RDS","Amazon EFS"],a:[2],e:"Amazon RDS es una base de datos relacional administrada (MySQL incluido): AWS se encarga de parches, backups y alta disponibilidad."},
{t:"Una empresa necesita buscar texto en documentos almacenados en Amazon S3. ¿Qué servicio de AWS cumplirá estos requisitos?",o:["Amazon Kendra","Amazon Rekognition","Amazon Polly","Amazon Lex"],a:[0],e:"Amazon Kendra es un servicio de búsqueda inteligente con ML que indexa documentos (incluido S3). Rekognition analiza imágenes, Polly convierte texto a voz y Lex crea chatbots."},
{t:"Una compañía quiere revisar periódicamente su cuenta de AWS para encontrar oportunidades de optimización de costes. ¿Qué servicio o herramienta puede utilizar?",o:["AWS Cost Explorer","AWS Trusted Advisor","Calculadora de precios de AWS","AWS Artifact"],a:[1],e:"Trusted Advisor revisa tu cuenta y da recomendaciones concretas de optimización de costes (recursos infrautilizados, instancias inactivas, etc.). Cost Explorer visualiza gastos pero no da recomendaciones de buenas prácticas."},
{t:"El equipo de TI gestiona clústeres MySQL, aplica parches y hace snapshots de backup. La empresa quiere trasladarlo a AWS para que estas tareas se realicen automáticamente. ¿Qué debería hacer?",o:["Implementar clústeres MySQL en instancias de Amazon EC2","Utilizar Amazon RDS con una base de datos MySQL","Usar una plantilla de CloudFormation para implementar MySQL en EC2","Migrar todos los datos de MySQL a Amazon S3"],a:[1],e:"Con RDS, AWS automatiza parches y backups/snapshots. En EC2 (con o sin CloudFormation) seguirías siendo responsable de esas tareas."},
{t:"¿Qué mecanismo permite a los desarrolladores acceder a los servicios de AWS desde el código de la aplicación?",o:["Kit de desarrollo de software de AWS (SDK)","Consola de administración de AWS","AWS CodePipeline","AWS Config"],a:[0],e:"Los SDK de AWS (Python/boto3, Java, JavaScript, .NET…) permiten llamar a las APIs de AWS directamente desde el código."},
{t:"Una empresa ha migrado sus cargas a AWS y desea adoptar AWS a escala y operar de forma más eficiente y segura. ¿Qué servicio o marco debería usar para el soporte operativo?",o:["AWS Support","AWS Cloud Adoption Framework (AWS CAF)","AWS Managed Services (AMS)","AWS Well-Architected Framework"],a:[2],e:"AWS Managed Services opera la infraestructura por ti (parches, monitorización, seguridad, backups), ayudando a adoptar AWS a escala de forma eficiente y segura."},
{t:"Una compañía quiere usar AWS CAF para definir y hacer seguimiento de los resultados empresariales en su transformación a la nube. ¿Qué capacidad de la perspectiva de gobernanza cumple esto?",o:["Gestión de beneficios","Gestión de riesgos","Gestión de la cartera de aplicaciones","Gestión financiera en la nube"],a:[0],e:"La gestión de beneficios (Benefits management) en la perspectiva de gobernanza del CAF se centra en definir, medir y dar seguimiento a los resultados de negocio de la inversión en la nube."},
{t:"Si una empresa desea crear un chatbot interactivo para que un centro de llamadas sea más eficiente, ¿qué servicio de AWS debería utilizar?",o:["Amazon Connect","Amazon Lex","Amazon Translate","Amazon Polly"],a:[1],e:"Amazon Lex crea interfaces conversacionales (chatbots de voz y texto) — es la tecnología de Alexa. Connect es el centro de contacto en sí, que puede integrar Lex."},
{t:"¿Qué servicio o característica de AWS puede utilizar una empresa para crear un entorno de red privado, seguro y escalable en la nube de AWS?",o:["Amazon ECS","Amazon S3","Amazon VPC","AWS Direct Connect"],a:[2],e:"Amazon VPC (Virtual Private Cloud) crea una red virtual aislada lógicamente donde controlas subredes, rutas, gateways y seguridad."},
{t:"¿Cuáles son características de una aplicación sin servidor (serverless) en AWS? (Seleccione DOS.)",o:["Los usuarios deben configurar manualmente instancias de EC2","Los usuarios pueden elegir entre varios sistemas operativos","La aplicación incorpora tolerancia a fallos","Los usuarios pueden ejecutar instancias Spot de EC2","La aplicación puede escalar en función de la demanda"],a:[2,4],e:"Serverless (Lambda, Fargate, DynamoDB…) trae alta disponibilidad/tolerancia a fallos integrada y escala automáticamente. No gestionas servidores, SO ni instancias."},
{t:"Una empresa opera varias fábricas y necesita procesar y almacenar datos y ejecutar aplicaciones con interdependencias de sistemas locales que requieren baja latencia. ¿Qué servicio debería utilizar?",o:["AWS IoT Greengrass","AWS Lambda","AWS Outposts","AWS Snowball Edge"],a:[2],e:"AWS Outposts lleva infraestructura y servicios de AWS a tus propias instalaciones para cargas que requieren baja latencia con sistemas locales."},
{t:"Una compañía necesita almacenar de forma segura credenciales que una aplicación usa para conectarse a una base de datos, con la MÍNIMA sobrecarga operativa. ¿Qué servicio cumple esto?",o:["AWS Key Management Service (KMS)","AWS Secrets Manager","AWS Artifact","Amazon GuardDuty"],a:[1],e:"Secrets Manager almacena, cifra y rota automáticamente credenciales de bases de datos y claves de API. KMS gestiona claves de cifrado, no secretos de aplicación."},
{t:"Una empresa desea utilizar una instancia EC2 que tenga un firewall de terceros preinstalado. ¿Qué servicio puede proporcionar esta solución?",o:["Grupos de seguridad","AWS Marketplace","AWS Systems Manager","AWS Certificate Manager (ACM)"],a:[1],e:"AWS Marketplace ofrece AMIs y software de terceros (firewalls, appliances, etc.) listos para desplegar en EC2."},
{t:"¿Qué servicio de AWS es un servicio de control de versiones totalmente hospedado?",o:["AWS CodeCommit","AWS CodeBuild","AWS CodeDeploy","AWS CodeStar"],a:[0],e:"CodeCommit aloja repositorios Git privados gestionados. CodeBuild compila/prueba, CodeDeploy despliega y CodeStar gestiona proyectos."},
{t:"¿Qué servicio admite el análisis, la investigación y la identificación de la causa raíz de eventos de seguridad y actividades sospechosas en una cuenta de AWS?",o:["Amazon Inspector","Amazon Macie","Amazon Detective","Amazon CloudWatch"],a:[2],e:"Amazon Detective investiga y analiza la causa raíz de hallazgos de seguridad. GuardDuty detecta amenazas; Detective ayuda a investigarlas."},
{t:"¿Qué puede usar un profesional de la nube para obtener documentos de seguridad y conformidad de AWS y presentarlos como prueba a un auditor o regulador?",o:["AWS Certificate Manager","AWS Systems Manager","AWS Artifact","Amazon Inspector"],a:[2],e:"AWS Artifact es el portal de autoservicio para descargar informes de cumplimiento (SOC, ISO, PCI) y acuerdos con AWS."},
{t:"Una compañía anima a sus equipos a probar escenarios de fallos con regularidad y validar su comprensión del impacto de posibles fallos. ¿Qué pilar del Well-Architected Framework representa esta filosofía?",o:["Excelencia operativa","Optimización de costes","Eficiencia del rendimiento","Seguridad"],a:[0],e:"'Anticipar los fallos' (realizar ejercicios pre-mortem y probar escenarios de fallo) es un principio de diseño del pilar de Excelencia operativa."},
{t:"Una empresa quiere añadir y eliminar automáticamente instancias EC2 para ajustarse dinámicamente a cargas variables. ¿Qué servicio o característica cumplirá esto?",o:["Amazon DynamoDB","Instancias Spot de EC2","Familia AWS Snow","Amazon EC2 Auto Scaling"],a:[3],e:"EC2 Auto Scaling aumenta o reduce el número de instancias automáticamente según la demanda o políticas definidas."},
{t:"Una empresa debe entregar datos en tiempo real desde un centro de datos on-premise a una aplicación en AWS y necesita una conexión de red consistente con latencia mínima. ¿Qué debería usar?",o:["AWS Direct Connect","AWS Site-to-Site VPN","Gateway de Internet","Gateway NAT"],a:[0],e:"Direct Connect es una conexión de red dedicada y privada a AWS, con rendimiento consistente y baja latencia. La VPN viaja por Internet, por lo que su latencia es variable."},
{t:"¿Qué beneficio de la nube de AWS se logra gracias a las Regiones, zonas de disponibilidad y ubicaciones de borde?",o:["Economías de escala","Alcance mundial","Agilidad","Alta disponibilidad"],a:[1],e:"La presencia de Regiones, AZ y ubicaciones de borde por todo el mundo permite desplegar globalmente en minutos: 'hacerse global en minutos' (alcance mundial)."},
{t:"Un usuario tiene una carga de trabajo con estado que se ejecutará en Amazon EC2 durante los próximos 3 años. ¿Cuál es el modelo de precios MÁS rentable?",o:["Instancias bajo demanda","Instancias reservadas","Instancias dedicadas","Instancias Spot"],a:[1],e:"Para uso continuo y predecible de 3 años, las instancias reservadas dan hasta ~72% de descuento. Spot puede interrumpirse, lo que no sirve para una carga con estado."},
{t:"Una empresa necesita un servicio que monitorice continuamente su cuenta en busca de actividad sospechosa y permita iniciar acciones automatizadas contra las amenazas identificadas. ¿Qué servicio cumplirá esto?",o:["AWS Trusted Advisor","Amazon Detective","Amazon Inspector","Amazon GuardDuty"],a:[3],e:"GuardDuty detecta amenazas continuamente (analiza CloudTrail, VPC Flow Logs, DNS) y sus hallazgos pueden disparar respuestas automáticas con EventBridge y Lambda."},
{t:"Los empleados de una empresa cambian a menudo de equipo y se necesitan permisos apropiados a sus responsabilidades. ¿Qué recurso de IAM cumple esto con la MENOR sobrecarga operativa?",o:["Grupos de usuarios de IAM","Roles de IAM","Perfiles de instancia de IAM","Políticas de IAM para usuarios individuales"],a:[0],e:"Asignas políticas a grupos (por equipo) y solo mueves al usuario de un grupo a otro cuando cambia de equipo. Las políticas individuales generan mucha más administración."},
{t:"Una empresa desea usar la nube de AWS para implementar una aplicación de forma global. ¿Qué modelo de despliegue debería utilizar?",o:["Multirregión","Una sola Región","Multi-AZ","Single-AZ"],a:[0],e:"Para llegar a usuarios en distintas partes del mundo se despliega en varias Regiones. Multi-AZ da alta disponibilidad, pero dentro de una sola Región."},
{t:"Una empresa sospecha que sus recursos de AWS se están utilizando para actividades ilegales. ¿A qué equipo de AWS debe informar?",o:["Equipo de abuso de AWS (AWS Abuse)","Equipo de AWS Support","Gestores técnicos de cuentas de AWS","Equipo de servicios profesionales de AWS"],a:[0],e:"El equipo AWS Trust & Safety (Abuse) atiende reportes de uso indebido: spam, ataques, contenido ilegal, etc."},
{t:"Una empresa desea comparar los costes de su infraestructura local con los de ejecutarla en la nube de AWS. ¿Cómo debería hacer esta comparación?",o:["Revisar el modelo de responsabilidad compartida","Auditar los costes de licencias de software y hardware existentes","Analizar el marco Well-Architected","Utilizar Migration Evaluator"],a:[3],e:"Migration Evaluator (antes TSO Logic) analiza tu entorno actual y crea un caso de negocio comparando el coste on-premise con el de AWS."},
{t:"El uso de Amazon ECS para descomponer una arquitectura monolítica en microservicios es un ejemplo de:",o:["Una arquitectura débilmente acoplada","Una arquitectura estrechamente acoplada","Una arquitectura sin estado","Una arquitectura con estado"],a:[0],e:"Los microservicios son independientes entre sí: un fallo o cambio en uno no afecta a los demás. Eso es acoplamiento débil (loose coupling)."},
{t:"¿Qué servicio de AWS proporciona almacenamiento de objetos con durabilidad de 11 nueves?",o:["Amazon EBS","Amazon S3","Amazon EFS","AWS Storage Gateway"],a:[1],e:"Amazon S3 es almacenamiento de objetos con durabilidad del 99.999999999%. EBS es almacenamiento en bloque y EFS es sistema de archivos."},
{t:"Una empresa necesita archivar datos durante 10 años que casi nunca se consultan, al menor coste posible. ¿Qué clase de almacenamiento es la mejor opción?",o:["S3 Standard","S3 Standard-IA","S3 Glacier Deep Archive","S3 One Zone-IA"],a:[2],e:"Glacier Deep Archive es la clase más barata de S3, diseñada para archivado a largo plazo con recuperación en horas."},
{t:"¿Qué servicio se usa para supervisar métricas de recursos (por ejemplo, uso de CPU de EC2) y crear alarmas?",o:["AWS CloudTrail","Amazon CloudWatch","AWS Config","AWS X-Ray"],a:[1],e:"CloudWatch recopila métricas, logs y permite crear alarmas y paneles. CloudTrail registra llamadas a la API (quién hizo qué)."},
{t:"Una empresa necesita saber qué usuario eliminó un bucket de S3 y cuándo. ¿Qué servicio proporciona esta información?",o:["Amazon CloudWatch","AWS CloudTrail","Amazon Inspector","AWS Trusted Advisor"],a:[1],e:"CloudTrail registra todas las llamadas a la API de la cuenta: quién, qué acción, cuándo y desde dónde. Es la herramienta de auditoría."},
{t:"¿Qué servicio de AWS protege las aplicaciones contra ataques de denegación de servicio distribuido (DDoS)?",o:["AWS Shield","Amazon Macie","AWS IAM","Amazon Cognito"],a:[0],e:"AWS Shield protege contra DDoS: Shield Standard es gratuito y automático; Shield Advanced agrega protección extendida y equipo de respuesta."},
{t:"Una empresa quiere bloquear ataques de inyección SQL y cross-site scripting (XSS) en su aplicación web. ¿Qué servicio debe usar?",o:["AWS WAF","AWS Shield Standard","Grupos de seguridad","ACL de red"],a:[0],e:"AWS WAF es un firewall de aplicaciones web (capa 7) que filtra peticiones HTTP con reglas contra SQLi, XSS y más. Grupos de seguridad y NACL trabajan a nivel de red (IP/puerto)."},
{t:"¿Cuál es una práctica recomendada para proteger el usuario raíz de una cuenta de AWS?",o:["Compartir sus credenciales solo con administradores","Habilitar la autenticación multifactor (MFA)","Usarlo para las tareas diarias","Crear claves de acceso para él"],a:[1],e:"Debes habilitar MFA en la cuenta raíz, no crear claves de acceso para ella y usarla solo para tareas que la requieran. Para el día a día se usan usuarios o roles de IAM."},
{t:"Una empresa quiere estimar el costo mensual de una arquitectura antes de desplegarla en AWS. ¿Qué herramienta debe usar?",o:["AWS Cost Explorer","Calculadora de precios de AWS","AWS Budgets","Informe de costos y uso de AWS"],a:[1],e:"La AWS Pricing Calculator estima costos de servicios antes de usarlos. Cost Explorer y CUR analizan costos que ya ocurrieron."},
{t:"Una empresa quiere recibir una alerta cuando su gasto mensual previsto supere los 1,000 USD. ¿Qué servicio debe usar?",o:["AWS Budgets","AWS Cost Explorer","AWS Organizations","AWS Artifact"],a:[0],e:"AWS Budgets permite definir presupuestos de costo o uso y enviar alertas cuando el gasto real o previsto supera el umbral."},
{t:"Según el modelo de responsabilidad compartida, ¿cuál es responsabilidad del cliente al usar Amazon EC2?",o:["Mantenimiento del hardware físico","Aplicar parches al sistema operativo invitado","Seguridad física del centro de datos","Mantener el hipervisor"],a:[1],e:"En EC2 (IaaS) el cliente administra el SO invitado: parches, software, firewall del SO y grupos de seguridad. AWS se ocupa del hardware, hipervisor e instalaciones."},
{t:"¿Qué servicio de AWS es un servicio de DNS escalable y altamente disponible?",o:["Amazon Route 53","Amazon CloudFront","Elastic Load Balancing","AWS Direct Connect"],a:[0],e:"Route 53 es el servicio DNS gestionado de AWS; también registra dominios y hace comprobaciones de estado y enrutamiento."},
{t:"¿Qué servicio distribuye automáticamente el tráfico entrante entre varias instancias EC2?",o:["Amazon Route 53","Elastic Load Balancing (ELB)","Amazon VPC","AWS Global Accelerator"],a:[1],e:"ELB (Application, Network o Gateway Load Balancer) reparte el tráfico entre destinos sanos en una o varias AZ."},
{t:"Una empresa quiere ejecutar código en respuesta a eventos sin aprovisionar ni administrar servidores. ¿Qué servicio debe usar?",o:["Amazon EC2","AWS Lambda","Amazon Lightsail","AWS Elastic Beanstalk"],a:[1],e:"Lambda es cómputo serverless basado en eventos: solo subes el código y pagas por las invocaciones y el tiempo de ejecución."},
{t:"Una aplicación necesita una base de datos NoSQL de clave-valor con latencia de milisegundos a cualquier escala. ¿Qué servicio cumple esto?",o:["Amazon RDS","Amazon DynamoDB","Amazon Redshift","Amazon Neptune"],a:[1],e:"DynamoDB es una base de datos NoSQL de clave-valor y documentos, totalmente gestionada y serverless, con latencia de un solo dígito de milisegundos."},
{t:"Una empresa necesita un almacén de datos (data warehouse) para ejecutar consultas analíticas complejas sobre petabytes de datos. ¿Qué servicio debe usar?",o:["Amazon Redshift","Amazon DynamoDB","Amazon ElastiCache","Amazon Aurora"],a:[0],e:"Amazon Redshift es el data warehouse gestionado de AWS, optimizado para analítica (OLAP) a gran escala."},
{t:"¿Qué servicio ofrece almacenamiento en bloque persistente para instancias EC2?",o:["Amazon S3","Amazon EBS","Amazon EFS","Amazon S3 Glacier"],a:[1],e:"Amazon EBS proporciona volúmenes de bloque (como un disco duro) que se conectan a una instancia EC2 en la misma AZ."},
{t:"Varias instancias EC2 en distintas zonas de disponibilidad necesitan acceder al mismo sistema de archivos compartido de Linux. ¿Qué servicio debe usarse?",o:["Amazon EBS","Amazon EFS","Instance Store","Amazon S3 Glacier"],a:[1],e:"Amazon EFS es un sistema de archivos NFS gestionado y elástico al que pueden conectarse muchas instancias a la vez y desde varias AZ."},
{t:"¿Para qué tipo de carga de trabajo son más adecuadas las instancias Spot de EC2?",o:["Bases de datos de producción críticas","Cargas flexibles y tolerantes a interrupciones, como procesamiento por lotes","Aplicaciones que requieren funcionamiento continuo de 3 años","Servidores que requieren licencias por socket"],a:[1],e:"Spot usa capacidad sobrante con hasta 90% de descuento, pero AWS puede recuperarla con 2 minutos de aviso: ideal para cargas tolerantes a interrupciones."},
{t:"Una aplicación necesita desacoplar sus componentes usando una cola de mensajes totalmente gestionada. ¿Qué servicio debe usar?",o:["Amazon SNS","Amazon SQS","Amazon Kinesis","Amazon MQ"],a:[1],e:"Amazon SQS es una cola de mensajes gestionada que desacopla productores y consumidores. SNS es publicación/suscripción (envía a múltiples suscriptores)."},
{t:"Una empresa quiere enviar notificaciones por correo electrónico y SMS a muchos suscriptores cuando ocurra un evento. ¿Qué servicio debe usar?",o:["Amazon SQS","Amazon SNS","Amazon SES","AWS Step Functions"],a:[1],e:"Amazon SNS usa el modelo pub/sub: un mensaje publicado en un tema se envía a todos sus suscriptores (email, SMS, Lambda, SQS, HTTP)."},
{t:"¿Cuál de los siguientes NO es un pilar del AWS Well-Architected Framework?",o:["Sostenibilidad","Fiabilidad","Escalabilidad","Excelencia operativa"],a:[2],e:"Los seis pilares son: Excelencia operativa, Seguridad, Fiabilidad, Eficiencia del rendimiento, Optimización de costes y Sostenibilidad. La escalabilidad no es un pilar."},
{t:"Una empresa necesita descubrir y proteger datos confidenciales, como información personal (PII), almacenados en Amazon S3. ¿Qué servicio debe usar?",o:["Amazon Macie","Amazon Inspector","AWS Shield","Amazon Detective"],a:[0],e:"Amazon Macie usa machine learning para descubrir y clasificar datos sensibles (PII, datos financieros) en buckets de S3."},
{t:"¿Qué servicio evalúa automáticamente las instancias EC2 y las imágenes de contenedores en busca de vulnerabilidades de software?",o:["Amazon GuardDuty","Amazon Inspector","AWS Config","AWS Artifact"],a:[1],e:"Amazon Inspector escanea EC2, imágenes en ECR y funciones Lambda en busca de vulnerabilidades (CVE) y exposición de red."},
{t:"Una empresa quiere registrar los cambios de configuración de sus recursos de AWS y evaluar si cumplen con reglas internas. ¿Qué servicio debe usar?",o:["AWS Config","AWS CloudTrail","Amazon CloudWatch","AWS Trusted Advisor"],a:[0],e:"AWS Config registra el historial de configuración de los recursos y evalúa su cumplimiento frente a reglas definidas."},
{t:"Una empresa con varias cuentas de AWS quiere recibir una sola factura y aprovechar descuentos por volumen. ¿Qué servicio debe usar?",o:["AWS Organizations (facturación consolidada)","AWS Budgets","AWS Cost Explorer","AWS Control Tower"],a:[0],e:"AWS Organizations ofrece facturación consolidada: una factura para todas las cuentas y suma del uso para obtener descuentos por volumen."},
{t:"Una empresa quiere migrar una base de datos Oracle a Amazon Aurora con un tiempo de inactividad mínimo. ¿Qué servicio debe usar?",o:["AWS Database Migration Service (DMS)","AWS DataSync","AWS Snowball","AWS Application Migration Service"],a:[0],e:"AWS DMS migra bases de datos manteniendo la base de origen operativa; junto con la Schema Conversion Tool permite migraciones heterogéneas como Oracle → Aurora."},
{t:"¿Qué principio de seguridad recomienda otorgar a los usuarios solo los permisos que necesitan para realizar su trabajo?",o:["Defensa en profundidad","Principio de privilegio mínimo","Cifrado en reposo","Responsabilidad compartida"],a:[1],e:"El privilegio mínimo (least privilege) consiste en conceder únicamente los permisos estrictamente necesarios, reduciendo el riesgo si una credencial se ve comprometida."},
{t:"¿Cuál es el plan de AWS Support más económico que ofrece acceso 24/7 por teléfono a ingenieros de soporte en la nube?",o:["Basic","Developer","Business","Enterprise"],a:[2],e:"Business es el plan más económico con acceso 24/7 por teléfono, correo y chat. Developer solo ofrece correo en horario laboral y Basic no incluye soporte técnico."},
{"t": "Una empresa aloja una aplicación web en AWS. La empresa ha mejorado la disponibilidad de su aplicación aprovisionando múltiples instancias de Amazon EC2. La empresa desea distribuir el tráfico entre las instancias EC2 mientras proporciona un único punto de contacto para los clientes web. ¿Qué servicio de AWS puede distribuir el tráfico hacia múltiples instancias EC2 como destinos?", "o": ["VPC endpoints", "Application Load Balancer", "NAT gateway", "Internet gateway"], "a": [1], "e": "Application Load Balancer distribuye el tráfico HTTP y HTTPS entre destinos, como instancias EC2, y proporciona un único punto de contacto para los clientes. Los endpoints de VPC permiten acceso privado a servicios; las gateways NAT e Internet no balancean el tráfico de la aplicación entre instancias."},
{"t": "Una empresa desea migrar su base de datos SQL Server que actualmente se ejecuta on-premises hacia la nube de AWS. La empresa desea que AWS se encargue de la administración diaria de la base de datos. ¿Qué servicio de AWS cumple con estos requisitos?", "o": ["Amazon EC2 for Microsoft SQL Server", "Amazon DynamoDB", "Amazon RDS", "Amazon Aurora"], "a": [2], "e": "Amazon RDS for SQL Server administra tareas como copias de seguridad y mantenimiento del motor. En EC2, el cliente administra la base de datos. DynamoDB es NoSQL y Aurora es compatible con MySQL y PostgreSQL, no con el motor SQL Server. El cliente sigue siendo responsable de sus datos y de la configuración de acceso."},
{"t": "Una empresa necesita filtrado de red sin estado (stateless) para su VPC. ¿Qué servicio, herramienta o característica de AWS cumple con este requisito?", "o": ["AWS PrivateLink", "Security group", "Network access control list (ACL)", "AWS WAF"], "a": [2], "e": "Las ACL de red filtran tráfico a nivel de subred y son sin estado: las reglas de entrada y salida se evalúan por separado, incluido el tráfico de respuesta. Los grupos de seguridad son con estado. AWS WAF filtra solicitudes web y PrivateLink proporciona conectividad privada."},
{"t": "Una empresa ha migrado toda su infraestructura a la nube de AWS. Para planificar cada trimestre, el equipo financiero desea hacer seguimiento del costo y uso de todos los recursos correspondientes a meses anteriores. El equipo financiero desea generar automáticamente reportes que contengan estos datos. ¿Qué servicio o característica de AWS debería utilizar para cumplir con estos requisitos?", "o": ["Amazon Detective", "AWS Pricing Calculator", "AWS Cost Explorer", "AWS Savings Plans"], "a": [2], "e": "Entre estas opciones, AWS Cost Explorer permite consultar y analizar costos y uso históricos mediante gráficos e informes con datos que se actualizan automáticamente. Pricing Calculator estima costos de arquitecturas; Savings Plans ofrece descuentos por compromiso y Detective investiga eventos de seguridad. Para exportaciones detalladas programadas se pueden utilizar AWS Data Exports y los informes de costos y uso."},
{"t": "Una empresa desea un servicio totalmente administrado que centralice y automatice la protección de datos en servicios de AWS y cargas de trabajo híbridas. ¿Qué servicio de AWS cumple con estos requisitos?", "o": ["AWS Artifact", "AWS Backup", "AWS Batch", "AWS Shield"], "a": [1], "e": "AWS Backup centraliza y automatiza las copias de seguridad mediante políticas para servicios compatibles de AWS y cargas híbridas compatibles. Artifact ofrece documentos de cumplimiento, Batch ejecuta trabajos por lotes y Shield protege contra ataques DDoS."},
{"t": "Una empresa tiene una aplicación on-premises. La aplicación tiene tiempos de procesamiento menores a 5 minutos y se ejecuta solo unas pocas veces al día. La empresa desea mover la aplicación a la nube de AWS. ¿Qué servicio de AWS soportará esta aplicación de la forma MÁS rentable?", "o": ["Amazon Elastic Container Service (Amazon ECS)", "AWS Lambda", "Amazon Elastic Kubernetes Service (Amazon EKS)", "Amazon EC2"], "a": [1], "e": "AWS Lambda es adecuado para ejecuciones breves y esporádicas compatibles con su entorno: se cobra por solicitudes y duración de ejecución sin mantener un servidor dedicado activo entre ejecuciones. La elección supone que la aplicación puede adaptarse a Lambda y no requiere características incompatibles con este servicio."},
{"t": "Una empresa desea una opción rentable para ejecutar sus aplicaciones en instancias de Amazon EC2 durante períodos cortos. Las aplicaciones pueden ser interrumpidas. ¿Qué tipo de instancia de EC2 cumple con estos requisitos?", "o": ["Spot Instances", "On-Demand Instances", "Reserved Instances", "Dedicated Instances"], "a": [0], "e": "Las instancias Spot aprovechan capacidad disponible de EC2 con descuentos y pueden ser interrumpidas. Son apropiadas para cargas flexibles que toleran interrupciones. Las instancias reservadas requieren un compromiso y las dedicadas atienden necesidades de aislamiento."},
{"t": "¿Cuáles de los siguientes servicios de AWS son serverless? (Seleccione DOS.) Para MSK y EMR, considere las modalidades aprovisionadas indicadas en las opciones.", "o": ["AWS Fargate", "Amazon Managed Streaming for Apache Kafka (MSK Provisioned)", "Amazon EMR (clústeres sobre EC2)", "Amazon S3", "Amazon EC2"], "a": [0, 3], "e": "AWS Fargate ejecuta contenedores sin administrar servidores y Amazon S3 ofrece almacenamiento de objetos sin aprovisionar servidores. EC2 requiere administrar instancias. Aclaración sobre la captura original: también existen MSK Serverless y EMR Serverless; aquí las opciones MSK y EMR se refieren expresamente a modalidades aprovisionadas."},
{"t": "¿Qué servicio de AWS está siempre disponible sin costo adicional por el propio servicio para los usuarios?", "o": ["Amazon Athena", "AWS Identity and Access Management (IAM)", "AWS Secrets Manager", "Amazon ElastiCache"], "a": [1], "e": "AWS IAM permite administrar identidades y permisos sin cargo adicional por el servicio. Los recursos de AWS a los que se accede mediante IAM pueden generar cargos. Athena, Secrets Manager y ElastiCache tienen precios asociados a su uso."},
{"t": "¿Qué beneficio de la nube de AWS ofrece a los usuarios la posibilidad de aprovisionar solo los recursos necesarios y de escalarlos horizontal o verticalmente de manera instantánea a medida que cambia la demanda?", "o": ["Ahorro de costos", "Elasticidad", "Alta disponibilidad", "Seguridad"], "a": [1], "e": "Incorrecto. La alta disponibilidad se refiere a las aplicaciones que no tienen un único punto de error. Las aplicaciones de alta disponibilidad seguirán ejecutándose y estarán disponibles incluso si se produce un error en el diseño. La alta disponibilidad garantiza el funcionamiento continuo de las aplicaciones. Sin embargo, la alta disponibilidad no está relacionada con el aprovisionamiento o el escalado de los recursos a medida que cambia la demanda. Incorrecto. El ahorro de costos se produce cuando los usuarios cambian los costos fijos por costos variables al migrar a la nube de AWS. El ahorro de costos no se relaciona con la capacidad de escalar los recursos vertical u horizontalmente. Incorrecto. La seguridad brinda a los usuarios la capacidad de acatar los requisitos de cumplimiento y proteger la información, las identidades, las aplicaciones y los dispositivos. La seguridad no se relaciona con el aprovisionamiento o el escalado de los recursos a medida que cambia la demanda. Correcto. La elasticidad brinda a los usuarios la capacidad de aprovisionar solo los recursos necesarios y escalar los recursos al instante vertical u horizontalmente a medida que cambia la demanda. La elasticidad es un beneficio de la nube de AWS.", "domain": "Conceptos de nube"},
{"t": "¿Qué servicio o función se debe usar para limitar el acceso de usuarios específicos al bucket de Amazon S3?", "o": ["ACL de red", "Grupos de seguridad", "AWS Key Management Service (AWS KMS)", "Políticas de IAM"], "a": [3], "e": "Incorrecto. AWS KMS es un servicio administrado que le ayuda a crear y controlar las claves que utiliza para encriptar y proteger los datos. AWS KMS puede encriptar los datos en Amazon S3, pero no restringe el acceso a los buckets de S3. Incorrecto. Las ACL de red son firewalls que funcionan a nivel de subred. Protegen los recursos de una VPC, pero no los buckets de S3. Correcto. Redactar una política de IAM para conceder acceso de lectura y escritura a un bucket de S3 le ayuda a controlar quién puede acceder a los datos almacenados en Amazon S3. Incorrecto. Un grupo de seguridad actúa como un firewall virtual para los recursos de AWS con los que está asociado. Los grupos de seguridad no controlan el acceso a los buckets de S3.", "domain": "Seguridad y cumplimiento"},
{"t": "¿Qué servicio de AWS utiliza machine learning para identificar la información confidencial que se almacena en los buckets de Amazon S3?", "o": ["Amazon Macie", "AWS CodePipeline", "Amazon Personalize", "AWS CodeArtifact"], "a": [0], "e": "Incorrecto. Amazon Personalize es un servicio de machine learning que utiliza datos para generar recomendaciones de artículos para sus usuarios. Amazon Personalize no identifica la información confidencial que se almacena en los buckets de S3. Correcto. Macie es un servicio de seguridad de datos que detecta información confidencial. Macie utiliza machine learning y coincidencia de patrones para identificar la información confidencial que se almacena en buckets de S3. Incorrecto. CodePipeline es un servicio de entrega continua que puede utilizar para modelar, visualizar y automatizar los pasos necesarios para lanzar software. CodePipeline no identifica la información confidencial que se almacena en los buckets de S3. Incorrecto. CodeArtifact es un servicio de repositorio de artefactos administrado. Puede utilizar CodeArtifact para almacenar y compartir paquetes de software para desarrollar aplicaciones. CodeArtifact no identifica la información confidencial que se almacena en los buckets de S3.", "domain": "Seguridad y cumplimiento"},
{"t": "Una empresa ejecuta una carga de trabajo de producción en AWS. ¿Qué plan de AWS Support le brindará a la empresa soporte técnico en un plazo de 15 minutos luego de que un usuario inicie un caso relacionado con la interrupción de un servicio fundamental?", "o": ["Enterprise Support", "Basic Support", "Business Support", "Developer Support"], "a": [0], "e": "Incorrecto. Los planes Basic Support no ofrecen un acuerdo de nivel de servicios (SLA) de 15 minutos para recibir asistencia técnica de AWS para aplicaciones clave de la empresa. Basic Support ofrece acceso las 24 horas del día, los 7 días de la semana al servicio de atención al cliente, la documentación, los documentos técnicos y los foros de soporte. Basic Support también ofrece acceso a AWS Trusted Advisor y al panel de AWS Health. Incorrecto. Los planes Developer Support no ofrecen un acuerdo de nivel de servicio (SLA) de 15 minutos para recibir asistencia técnica de AWS para aplicaciones clave de la empresa. El soporte más rápido disponible para el plan Developer es el de problemas en el sistema, que es de menos de 12 horas de soporte. Incorrecto. Los planes Business Support no ofrecen un acuerdo de nivel de servicios (SLA) de 15 minutos para recibir asistencia técnica de AWS para aplicaciones clave de la empresa. El soporte más rápido disponible para el plan Business es el sistema de producción inactivo, que es de menos de 1 hora de soporte. Correcto. Para las aplicaciones clave de la empresa, el tiempo de respuesta de los planes Enterprise Support es inferior a los 15 minutos.", "domain": "Facturación, precios y soporte"},
{"t": "¿De qué manera se pueden compartir las instancias reservadas en varias cuentas de AWS?", "o": ["Con el explorador de costos de AWS activado en todas las cuentas de AWS", "Roles de IAM entre cuentas", "Con la facturación unificada de AWS Organizations", "Con AWS Compute Optimizer activado en todas las cuentas de AWS"], "a": [2], "e": "Incorrecto. El explorador de costos es una herramienta que permite ver y analizar los costos y el uso en una cuenta de AWS. No proporciona el uso compartido de cuentas de instancias reservadas. Correcto. Para la facturación, la función de facturación unificada de AWS Organizations considera a todas las cuentas de la organización como una sola cuenta. Esto significa que todas las cuentas de la organización pueden recibir el beneficio de costo por hora de las instancias reservadas que cualquier otra cuenta adquiera. Incorrecto. Compute Optimizer es un servicio que analiza las métricas de configuración y uso de los recursos de AWS. Compute Optimizer informa si los recursos son óptimos y genera recomendaciones de optimización para reducir los costos y mejorar el rendimiento de las cargas de trabajo. Compute Optimizer no proporciona el uso compartido de cuentas de instancias reservadas. Incorrecto. Los roles de IAM son una identidad de IAM con permisos específicos destinados a que los asuma cualquier persona que los necesite. Los roles de IAM se pueden compartir entre cuentas, pero no permiten compartir instancias reservadas en sí mismas.", "domain": "Facturación, precios y soporte"},
{"t": "Un sistema se recupera automáticamente de un error cuando una empresa inicia su carga de trabajo en la plataforma de servicios de la nube de AWS. ¿Qué pilar del marco de AWS Well-Architected demuestra esta situación?", "o": ["Optimización de costos", "Excelencia operativa", "Fiabilidad", "Eficiencia de rendimiento"], "a": [2], "e": "Correcto. El pilar de fiabilidad se centra en las cargas de trabajo que realizan las funciones previstas y en cómo recuperarse rápidamente de un error para cumplir con las demandas. Uno de los principios de diseño del pilar de fiabilidad es la recuperación automática en caso de error. Incorrecto. El pilar de optimización de costos se centra en la manera de evitar costos innecesarios. Los temas clave incluyen cómo gastar a lo largo del tiempo y controlar la asignación de fondos, seleccionar el tipo y cantidad correctos de recursos, además de escalar para satisfacer las necesidades empresariales sin gastar de más. Incorrecto. El pilar de eficiencia de rendimiento se centra en la asignación estructurada y optimizada de los recursos de cómputo y de TI. Los temas clave incluyen cómo seleccionar los tipos y tamaños de recursos optimizados para los requisitos de carga de trabajo, monitorear el rendimiento y mantener la eficiencia a medida que evolucionan las necesidades empresariales. Incorrecto. El pilar de la excelencia operativa se centra en cómo ejecutar y monitorear los sistemas, así como en la mejora continua de los procesos y procedimientos. Los temas clave incluyen cómo automatizar los cambios, responder a los eventos y definir estándares para administrar las operaciones diarias.", "domain": "Conceptos de nube"},
{"t": "Una empresa aloja una aplicación en una instancia de Amazon EC2. La instancia de EC2 necesita acceder a varios recursos de AWS, incluidos Amazon S3 y Amazon DynamoDB. ¿Cuál es la solución MÁS eficiente para delegar permisos desde el punto de vista operativo?", "o": ["Crear un rol de IAM con los permisos necesarios. Adjuntar el rol a la instancia de EC2.", "Crear un rol de IAM con los permisos necesarios. Adjuntar el rol al usuario administrativo de IAM.", "Crear un usuario de IAM y utilizar su clave de acceso y clave de acceso secreta en la aplicación.", "Crear un usuario de IAM y utilizar su clave de acceso y clave de acceso secreta para crear un perfil CLI en la instancia de EC2."], "a": [0], "e": "Correcto. Una solución que cree un rol de IAM con los permisos adecuados y lo adjunte a la instancia de EC2 proporcionará acceso a los recursos de AWS. Esta solución es una práctica recomendada de seguridad. Incorrecto. No se necesita una solución que incluya claves de acceso y claves de acceso secretas en el código de aplicación. Esta solución no es una práctica recomendada de seguridad. Adjuntar un rol de IAM con los permisos adecuados a la instancia de EC2 sería la mejor solución. Incorrecto. No se necesita de una solución que cree un usuario de IAM y utilice su clave de acceso y su clave de acceso secreta en un perfil. Esta solución no es una práctica recomendada de seguridad. Adjuntar un rol de IAM con los permisos adecuados a la instancia de EC2 sería la mejor solución. Incorrecto. La solución correcta sería crear un rol de IAM con los permisos adecuados. Sin embargo, debe adjuntar el rol de IAM a la instancia de EC2, no a un usuario de IAM.", "domain": "Seguridad y cumplimiento"},
{"t": "Una empresa quiere utilizar Amazon EC2 para implementar una aplicación comercial global. La solución de implementación se debe crear con la máxima redundancia y tolerancia a errores. ¿Cómo se deben implementar las instancias de EC2?", "o": ["En varias zonas de disponibilidad en una región de AWS", "En varias zonas de disponibilidad en dos regiones de AWS", "Con varias interfaces de red elástica que pertenecen a diferentes subredes", "En una sola zona de disponibilidad en una región de AWS"], "a": [1], "e": "Incorrecto. Los datos y los recursos de la carga de trabajo se deben distribuir en varias zonas de disponibilidad y regiones para crear una aplicación redundante y tolerante a errores. Incorrecto. Este diseño no mejora la redundancia ni la tolerancia a errores de una aplicación, ya que no especifica que las subredes deban estar en diferentes zonas de disponibilidad. Una práctica recomendada consiste en implementar componentes fundamentales de la aplicación en varias zonas de disponibilidad. Las interfaces de red elástica adicionales que se adjuntan a una instancia de Amazon EC2 deben estar en la misma zona de disponibilidad que la instancia. Incorrecto. Aunque este diseño mejora parcialmente la redundancia y la tolerancia a errores de la aplicación, no lo hace al más alto nivel. Se recomienda un enfoque multirregional para que las estrategias de recuperación ante desastres cumplan con los objetivos de recuperación. Correcto. Las regiones se componen de varias zonas de disponibilidad que están diseñadas para ser independientes entre sí. Cada zona de disponibilidad está separada de las otras por una distancia física significativa para evitar situaciones de error correlacionadas debido a riesgos ambientales como incendios, inundaciones y tornados. Un enfoque multirregional es común para que las estrategias de recuperación ante desastres cumplan con los objetivos de recuperación.", "domain": "Conceptos de nube"},
{"t": "¿Qué recomendaciones se incluyen en las verificaciones de AWS Trusted Advisor? (Seleccione DOS).", "o": ["Uso de la autenticación multifactor (MFA) en el usuario raíz de la cuenta de AWS", "Parches de software disponibles para instancias de Amazon EC2", "Permisos de bucket de Amazon S3", "Interrupciones del servicio de AWS para los servicios", "Cantidad de usuarios en la cuenta"], "a": [0, 2], "e": "Correcto. Trusted Advisor verifica los permisos de bucket de S3 de Amazon S3 con permisos de acceso abierto. Los permisos de bucket que otorgan acceso a través de listas a todos pueden generar cargas superiores a las esperadas si los objetos del bucket son listados por usuarios no deseados con alta frecuencia. Los permisos de bucket que otorgan acceso de carga y eliminación a todos los usuarios, crean posibles vulnerabilidades de seguridad porque permiten que cualquier persona agregue, modifique o elimine elementos de un bucket. Esta verificación de Trusted Advisor examina los permisos de bucket explícitos y las políticas de bucket asociadas que podrían anular los permisos. Incorrecto. Trusted Advisor no proporciona notificaciones sobre las interrupciones del servicio. Puede utilizar el panel de AWS Health para obtener información sobre los eventos de AWS Health que pueden afectar a los servicios o a la cuenta de AWS. Correcto. Trusted Advisor verifica la cuenta raíz y advierte si la MFA no está habilitada. Incorrecto. Trusted Advisor no muestra notificaciones sobre parches de software para instancias de EC2. Incorrecto. Trusted Advisor no proporciona información sobre la cantidad de usuarios en una cuenta de AWS.", "domain": "Seguridad y cumplimiento"},
{"t": "Una empresa necesita establecer un túnel de AWS Site-to-Site VPN. ¿Qué tipo de puerta de enlace debe utilizar la empresa?", "o": ["Puerta de enlace de AWS Direct Connect", "Puerta de enlace de Internet", "Puerta de enlace de NAT", "Puerta de enlace privada virtual"], "a": [3], "e": "Incorrecto. Puede utilizar una puerta de enlace de Internet para establecer conexiones públicas a Internet para una Amazon VPC. Sin embargo, las puertas de enlace de Internet no establecen conexiones con los túneles de Site-to-Site VPN. Incorrecto. Puede usar una puerta de enlace de NAT para establecer una conexión para las instancias de una subred privada dentro de una VPC. Las puertas de enlace de NAT le proporcionan a las instancias la capacidad de conectarse a los recursos o servicios fuera de la VPC. Sin embargo, las puertas de enlace de NAT no establecen conexiones con los túneles de Site-to-Site VPN. Correcto. Puede usar una puerta de enlace privada virtual para establecer conexiones a la nube de AWS para sitios en las instalaciones a través de túneles de Site-to-Site VPN. Incorrecto. Una puerta de enlace de Direct Connect puede establecer una conexión desde sitios en las instalaciones a la nube de AWS. Una puerta de enlace de Direct Connect utiliza enlaces dedicados que están aislados de Internet. Sin embargo, las puertas de enlace de Direct Connect no establecen conexiones con los túneles de Site-to-Site VPN.", "domain": "Tecnología y servicios"},
{"t": "¿Qué principio de diseño de arquitectura se aplica al concepto de redimensionamiento de la infraestructura de la nube de AWS?", "o": ["Realizar operaciones como código.", "Escalar horizontalmente para aumentar la disponibilidad de la carga de trabajo.", "Realizar cambios frecuentes, pequeños y reversibles.", "Optimizar los costos."], "a": [3], "e": "Incorrecto. Es posible escalar horizontalmente para aumentar la disponibilidad de la carga de trabajo agregada como parte del pilar de fiabilidad. Sin embargo, esta solución no está relacionada con el redimensionamiento. Correcto. Es posible utilizar las métricas de la carga de trabajo que se ejecute actualmente a fin de seleccionar el tamaño y el tipo adecuados para optimizar los costos. Esta solución es una práctica recomendada del pilar de optimización de costos para el marco de trabajo de Well-Architected. Incorrecto. La solución para realizar cambios frecuentes, pequeños y reversibles es un principio de diseño relacionado con el pilar de excelencia operativa. Esta solución no se relaciona con el redimensionamiento. Incorrecto. La solución para realizar operaciones como código es un principio de diseño relacionado con el pilar de excelencia operativa. Esta solución no incluye el redimensionamiento.", "domain": "Conceptos de nube"},
{"t": "¿Qué función se puede utilizar para proteger los buckets de Amazon S3 contra sobreescrituras o eliminaciones accidentales?", "o": ["La encriptación del lado del servidor", "Los puntos de acceso de S3", "Políticas de ciclo de vida", "El control de versiones de un bucket"], "a": [3], "e": "Incorrecto. Es posible utilizar políticas de ciclo de vida para establecer reglas que permitan la transición de objetos a diferentes clases de almacenamiento. No es posible utilizar políticas de ciclo de vida para proteger los buckets de S3 contra sobreescrituras o eliminaciones. Correcto. El control de versiones de bucket permite mantener múltiples versiones de un objeto en un bucket de S3. Por lo tanto, si elimina o sobrescribe accidentalmente un objeto, Amazon S3 no lo elimina permanentemente. En su lugar, Amazon S3 inserta un marcador de eliminación para el objeto en buckets con el control de versiones activado. Esta función permite restaurar versiones anteriores de todos los objetos almacenados en el bucket. Incorrecto. Es posible utilizar la encriptación del lado del servidor para proteger los datos que se almacenan en Amazon S3. Sin embargo, la encriptación del lado del servidor no impide las sobreescrituras ni las eliminaciones. Incorrecto. Es posible utilizar los puntos de acceso de S3 para simplificar el acceso a un subconjunto de objetos en un bucket de S3. Sin embargo, los puntos de acceso de S3 no impiden las sobreescrituras ni las eliminaciones.", "domain": "Seguridad y cumplimiento"},
{"t": "¿Qué puede hacer una empresa para aislar los costos de las cargas de trabajo en producción y las que aún no están en producción en AWS?", "o": ["Utilizar Amazon EC2 para cargas de trabajo que no están en producción y otros servicios para las que están en producción.", "Crear roles de AWS Identity and Access Management (IAM) para las cargas de trabajo en producción y las que aún no están en producción.", "Utilizar cuentas diferentes para gastos de lo que está en producción y lo que no.", "Utilizar Amazon CloudWatch para monitorear el uso de los servicios."], "a": [2], "e": "Incorrecto. IAM es un servicio que ayuda a controlar de forma segura el acceso a los recursos de AWS. No proporciona asignación de costos. Correcto. Puede separar las cargas de trabajo en producción y las que no están en producción en AWS mediante la creación de varias cuentas para proporcionar el mayor nivel de aislamiento de recursos y facturación. AWS Organizations incluye capacidades de facturación unificada y administración de cuentas que le permiten satisfacer mejor las necesidades de presupuestos, seguridad y cumplimiento de su empresa. Incorrecto. La solución sugerida no brinda paridad de servicios para los diferentes entornos. Además, no aborda los costos separados, como la transferencia de datos. Incorrecto. Con CloudWatch puede obtener información sobre la utilización de recursos, el rendimiento de las aplicaciones y el estado operativo de todo el sistema. CloudWatch no proporciona información sobre los costos y el aislamiento de costos de las distintas cargas de trabajo.", "domain": "Facturación, precios y soporte"},
{"t": "Una empresa que está migrando a la nube de AWS necesita orientación sobre la administración del riesgo operativo. La empresa quiere reducir el perfil de riesgo general. ¿Qué perspectiva de AWS Cloud Adoption Framework (AWS CAF) proporciona orientación sobre la administración de riesgos?", "o": ["Perspectiva de operaciones", "Perspectiva empresarial", "Perspectiva de gobernanza", "Perspectiva de seguridad"], "a": [2], "e": "Incorrecto. La perspectiva empresarial de AWS CAF proporciona orientación sobre cómo llevar a cabo las inversiones adecuadas en la nube para cumplir los objetivos empresariales. La perspectiva empresarial no incluye capacidades para la administración de riesgos a medida que se migra a la nube. Incorrecto. La perspectiva de seguridad de AWS CAF proporciona orientación sobre cómo mantener seguros los datos, las aplicaciones y los recursos. La perspectiva de seguridad incluye capacidades como la gobernanza de la seguridad, la administración de identidades y accesos, la detección de amenazas y la protección de datos. Correcto. La perspectiva de gobernanza de AWS CAF proporciona orientación sobre la administración de riesgos y sobre cómo puede utilizar la nube de AWS para reducir el perfil de riesgo general. La perspectiva de gobernanza puede ayudar a reducir los riesgos relacionados con el funcionamiento y los errores de la infraestructura. Además, la perspectiva de gobernanza le puede ayudar a reducir los riesgos de comprar recursos o activos costosos que podrían no ser necesarios. Incorrecto. La perspectiva de operaciones de AWS CAF proporciona orientación para garantizar que sus aplicaciones y cargas de trabajo estén disponibles y en buen estado. La perspectiva de operaciones también proporciona orientación sobre cómo automatizar y optimizar sus operaciones para que sean más eficientes.", "domain": "Conceptos de nube"},
{"t": "Una empresa aloja un sitio web en una instancia de Amazon EC2. La empresa quiere reducir la latencia para los usuarios globales del sitio web. ¿Qué servicio de AWS cumplirá con este requisito?", "o": ["Amazon CloudFront", "AWS Snowball Edge", "AWS Outposts", "AWS CloudFormation"], "a": [0], "e": "Incorrecto. Outposts es un servicio completamente administrado que amplía la infraestructura, los servicios, las API y las herramientas de AWS a las instalaciones del cliente. Outposts proporciona acceso local a la infraestructura administrada de AWS. Outposts ofrece a los usuarios la posibilidad de crear y ejecutar aplicaciones en las instalaciones mediante las mismas interfaces de programación que se usan en las regiones de AWS. Outposts utiliza recursos de cómputo y almacenamiento locales para reducir la latencia y las necesidades de procesamiento de datos locales. Outposts puede reducir la latencia para los usuarios locales, pero no para los usuarios globales. Incorrecto. Snowball Edge es un tipo de dispositivo Snowball que cuenta con almacenamiento y potencia de cómputo integrados para determinadas funciones de AWS. Snowball Edge puede ejecutar cargas de trabajo de procesamiento local y de cómputo perimetral. Snowball Edge puede transferir datos entre el entorno local y la nube de AWS. Snowball Edge no mejoraría la latencia para los usuarios globales. Correcto. CloudFront es un servicio web que agiliza la distribución de contenido web estático y dinámico como archivos .html, .css, .js y archivos de imágenes a los usuarios. CloudFront entrega su contenido a través de una red mundial de centros de datos denominados ubicaciones perimetrales. Un usuario solicita contenido que se provee a través de CloudFront. CloudFront dirige la solicitud a la ubicación perimetral que proporcionará la latencia más baja. Incorrecto. CloudFormation es un servicio que le ayuda a modelar y configurar los recursos de AWS. CloudFormation le puede ayudar a reducir el tiempo que se necesita para administrar los recursos, de manera que se pueda centrar en las aplicaciones que ejecuta en AWS. Al crear una plantilla que describa todos los recursos de AWS que desee, CloudFormation proporciona y configura esos recursos por usted. CloudFormation no reduce la latencia para los usuarios globales.", "domain": "Tecnología y servicios"},
{"t": "¿Qué controles o funciones son controles compartidos según el modelo de responsabilidad compartida de AWS? (Seleccione DOS).", "o": ["Controles de entorno", "Controles de seguridad física", "Seguridad de la zona", "Administración de la configuración", "Administración de parches"], "a": [3, 4], "e": "Incorrecto. Los controles de seguridad física son aquellos que un cliente hereda de AWS. Incorrecto. Los controles de entorno son aquellos que un cliente hereda de AWS. Correcto. La administración de parches es un control compartido. AWS aplicará parches y corregirá los defectos en la infraestructura. Los clientes deben aplicar parches a los sistemas operativos y aplicaciones huéspedes. Incorrecto. Los controles de seguridad de zona son controles del cliente. Es posible que los clientes necesiten enrutar o ubicar los datos en entornos de seguridad específicos. Correcto. La administración de la configuración es un control compartido. AWS mantiene la configuración de los dispositivos de infraestructura de AWS. Los clientes configuran sistemas operativos, bases de datos y aplicaciones huéspedes.", "domain": "Seguridad y cumplimiento"},
{"t": "Una empresa necesita auditar sus recursos de AWS. La empresa debe documentar cualquier cambio que se hizo en los recursos. ¿Qué servicio de AWS podría cumplir con estos requisitos?", "o": ["Amazon Inspector", "Amazon CloudWatch", "AWS Artifact", "AWS Config"], "a": [3], "e": "Incorrecto. AWS Artifact proporciona una ubicación central para acceder a los informes y acuerdos de seguridad y cumplimiento de AWS. AWS Artifact no audita ni registra los cambios en los recursos de AWS. Correcto. AWS Config es un servicio completamente administrado que puede proporcionar informes de auditoría del inventario y del historial de configuración de los recursos de AWS. Incorrecto. Amazon Inspector analiza las cargas de trabajo de AWS, incluye las instancias de Amazon EC2, las imágenes de contenedores de Amazon Elastic Container Registry (Amazon ECR) y las funciones de AWS Lambda. Amazon Inspector analiza estas cargas de trabajo en busca de vulnerabilidades de software y de una exposición no deseada de la red. Amazon Inspector no audita ni registra los cambios en los recursos de AWS. Incorrecto. CloudWatch recopila y realiza un seguimiento de las métricas para ayudar a monitorear los recursos de AWS en tiempo real. CloudWatch no audita ni registra los cambios en los recursos de AWS.", "domain": "Seguridad y cumplimiento"},
{"t": "¿Qué servicio de AWS ejecuta contenedores sin tener que aprovisionar y administrar instancias de Amazon EC2?", "o": ["Amazon Lightsail", "AWS Fargate", "AWS Batch", "AWS Elastic Beanstalk"], "a": [1], "e": "Incorrecto. Puede usar Elastic Beanstalk para implementar, administrar y escalar aplicaciones. Cuando ejecuta una aplicación en Elastic Beanstalk, no necesita desarrollar, administrar ni comprender la infraestructura subyacente. Puede iniciar una aplicación en Elastic Beanstalk que ejecute contenedores. Sin embargo, la aplicación se ejecutaría en instancias de EC2. Incorrecto. Lightsail proporciona una solución de servidor privado virtual (VPS) para empezar a utilizar AWS. Lightsail es ideal para desarrolladores, pequeñas empresas, estudiantes y otros usuarios. Lightsail le proporciona facultades y capacidades de cómputo, almacenamiento y redes. Con Lightsail puede implementar y administrar sitios y aplicaciones web en la nube. Lightsail puede ejecutar contenedores. Sin embargo, los contenedores se ejecutarían en instancias de EC2. Incorrecto. AWS Batch administra los entornos de cómputo y las colas de trabajos. Con AWS Batch puede ejecutar miles de trabajos a cualquier escala. AWS Batch utiliza instancias de EC2 para alojar los trabajos por lotes. AWS Batch puede ejecutar contenedores. Sin embargo, los contenedores se ejecutarían en instancias de EC2. Correcto. Puede usar Fargate con Amazon Elastic Container Service (Amazon ECS) para ejecutar contenedores sin tener que administrar servidores o clústeres de instancias de EC2. Fargate funciona sin servidores, por lo que no necesita aprovisionar ni administrar instancias de EC2.", "domain": "Tecnología y servicios"},
{"t": "Una empresa planea migrar a la nube de AWS. La empresa necesita orientación y prácticas recomendadas para guiar a las partes interesadas clave en el proceso de migración a la nube. ¿Qué servicio u orientación de AWS cumplirá con este requisito?", "o": ["Marco de AWS Well-Architected", "AWS Cloud Adoption Framework (AWS CAF)", "AWS Support", "Amazon Connect"], "a": [1], "e": "Incorrecto. El marco de Well-Architected proporciona las prácticas recomendadas de arquitectura para garantizar que sus cargas de trabajo y sistemas de AWS las sigan. El marco de Well-Architected proporciona orientación sobre el diseño de sistemas que sean fiables, seguros, eficientes, rentables y sostenibles. El marco de Well-Architected no proporciona información para guiar a las partes interesadas clave en el proceso de migración a la nube. Incorrecto. Puede usar Amazon Connect para configurar un centro de contacto en la nube. Amazon Connect no proporciona orientación ni prácticas recomendadas para guiar a las partes interesadas clave en el proceso de migración a la nube. Incorrecto. Puede utilizar AWS Support para obtener asistencia con la cuenta de AWS. AWS Support no proporciona prácticas recomendadas para guiar a las partes interesadas clave en el proceso de migración a la nube. Correcto. AWS CAF proporciona orientación y prácticas recomendadas sobre cómo hacer la migración a la nube de AWS satisfactoriamente. Además, AWS CAF proporciona orientación y prácticas recomendadas sobre cómo continuar innovando en la nube de AWS. Las seis perspectivas de AWS CAF incluyen los negocios, las personas, la gobernanza, la plataforma, la seguridad y las operaciones. Cada perspectiva contiene un conjunto de capacidades que guían a las partes interesadas clave en el proceso de migración a la nube.", "domain": "Conceptos de nube"},
{"t": "Una empresa quiere mejorar la seguridad de los usuarios de AWS Identity and Access Management (IAM) en una cuenta de AWS. ¿Qué métodos debe utilizar para aumentar la seguridad de los usuarios de IAM? (Seleccione DOS).", "o": ["Imponer un nivel de seguridad y vencimiento a la contraseña.", "Utilizar la autenticación multifactor (MFA).", "Utilizar los recursos protegidos de AWS Shield.", "Bloquear el acceso con grupos de seguridad.", "Implementar Amazon Rekognition."], "a": [0, 1], "e": "Incorrecto. Amazon Rekognition se utiliza para analizar imágenes y videos. No aumenta la seguridad de los usuarios de IAM. Incorrecto. Shield se utiliza para la protección contra ataques de denegación de servicio distribuido (DDoS). No aumenta la seguridad de los usuarios de IAM. Incorrecto. Los grupos de seguridad se utilizan para el acceso basado en la red con el fin de que actúen como un firewall virtual. Los grupos de seguridad no aumentan la seguridad de los usuarios de IAM. Correcto. El uso de la MFA es una práctica recomendada porque exige una prueba de autenticación adicional que por lo general es de tipo clave o código. Otro dispositivo genera las claves o códigos, los cuales pueden aumentar la seguridad de las credenciales de IAM. Correcto. Para proteger las credenciales de seguridad a largo plazo, puede rotar e invalidar las contraseñas o claves de acceso. La aplicación de políticas de contraseñas puede garantizar que las contraseñas se roten con frecuencia y puedan requerir complejidad, lo que refuerza las credenciales.", "domain": "Seguridad y cumplimiento"},
{"t": "¿Qué servicio ofrece a los clientes la posibilidad de auditar y monitorear los cambios en los recursos de AWS?", "o": ["AWS Config", "Amazon GuardDuty", "AWS Trusted Advisor", "Amazon Inspector"], "a": [0], "e": "Incorrecto. Trusted Advisor es una herramienta que brinda orientación en tiempo real a fin de ayudarle a seguir las prácticas recomendadas de AWS para aprovisionar recursos. Trusted Advisor no audita ni monitorea los cambios en los recursos de AWS. Incorrecto. GuardDuty es un servicio continuo de detección de eventos de seguridad. GuardDuty no audita ni monitorea los cambios en los recursos de AWS. Incorrecto. Amazon Inspector prueba la accesibilidad de red de las instancias de Amazon EC2 y el estado de seguridad de las aplicaciones que se ejecutan en dichas instancias. Amazon Inspector no monitorea los cambios en los recursos de AWS. Correcto. AWS Config es un servicio que le permite evaluar y auditar las configuraciones de los recursos de AWS.", "domain": "Seguridad y cumplimiento"},
{"t": "¿Qué perspectiva del AWS Cloud Adoption Framework (AWS CAF) conecta la tecnología con la empresa?", "o": ["Operaciones", "Seguridad", "Gobernanza", "Personas"], "a": [3], "e": "Incorrecto. La perspectiva de las operaciones ayuda a garantizar que sus servicios de la nube satisfagan las necesidades de su empresa. Esta perspectiva no conecta la tecnología con la empresa. Correcto. La perspectiva de las personas ayuda a transformar la migración a la nube con un aprendizaje continuo. Esta perspectiva conecta la tecnología con los negocios. Incorrecto. La perspectiva de seguridad ayuda a garantizar la confidencialidad, la integridad y la disponibilidad de sus datos y cargas de trabajo en la nube de AWS. Esta perspectiva no conecta la tecnología con la empresa. Incorrecto. La perspectiva de la gobernanza le ayuda a alcanzar sus objetivos en la nube y a maximizar sus beneficios. La perspectiva de la gobernanza también minimiza los riesgos de las transiciones a la nube de AWS. Esta perspectiva no conecta la tecnología con la empresa.", "domain": "Conceptos de nube"},
{"t": "Una empresa debe implementar una instancia de Amazon EC2 y adjuntar un montaje de almacenamiento para los archivos de la aplicación y del sistema operativo. ¿Qué servicio de AWS podría cumplir con estos requisitos?", "o": ["Amazon Elastic File System (Amazon EFS)", "Amazon S3", "Amazon Elastic Block Store (Amazon EBS)", "AWS Backup"], "a": [2], "e": "Incorrecto. AWS Backup es un servicio completamente administrado que automatiza y centraliza las copias de respaldo de los datos de múltiples servicios de almacenamiento de AWS y sistemas de almacenamiento en las instalaciones. AWS Backup no proporciona un montaje de almacenamiento para los archivos de la aplicación y del sistema operativo. Incorrecto. Amazon EFS proporciona un sistema de archivos compartidos completamente escalable y sin servidor. No es posible utilizar Amazon EFS para montar archivos del sistema operativo para instancias de EC2. Incorrecto. Amazon S3 es un almacenamiento basado en objetos con escalabilidad ilimitada. No es posible utilizar Amazon S3 para montar archivos del sistema operativo para instancias de EC2. Correcto. Amazon EBS es un servicio de almacenamiento en bloques de alto rendimiento que se puede utilizar con instancias de EC2. Es posible utilizar Amazon EBS para montar los archivos del sistema operativo y de la aplicación.", "domain": "Tecnología y servicios"},
