{"t": "¿Qué servicio o función de AWS le permite a una empresa analizar los costos y el uso de AWS a lo largo del tiempo?", "o": ["AWS Organizations", "Facturación unificada", "AWS Budgets", "Explorador de costos de AWS"], "a": [3], "e": "Incorrecto. AWS Budgets le permite establecer presupuestos personalizados que le avisen cuando los costos o el uso de AWS superen (o se pronostique que superarán) la cantidad presupuestada. AWS Budgets no le permite analizar el costo y el uso de AWS a lo largo del tiempo. Correcto. El explorador de costos tiene una interfaz que le permite analizar los costos y el uso de AWS a lo largo del tiempo. Puede usar el explorador de costos para ver los costos por mes, el servicio de AWS o el grupo de etiquetas. Este servicio se puede utilizar para comprender visualmente las tendencias de costos y uso a lo largo del tiempo. Incorrecto. AWS Organizations es un servicio para unificar varias cuentas de AWS en una organización. Puede usar AWS Organizations para unificar la facturación y aprovechar los descuentos en los precios por volumen. Sin embargo, AWS Organizations no proporciona análisis de costos y uso. Incorrecto. Si bien puede utilizar la función de facturación unificada en AWS Organizations para unificar el pago de varias cuentas de AWS o de Amazon Internet Services Private Limited (AISPL), esta función en sí misma no le permite analizar el costo y el uso a lo largo del tiempo.", "domain": "Facturación, precios y soporte"},
{"t": "Una empresa quiere aumentar su capacidad para recuperar su infraestructura en caso de un desastre natural. ¿Qué pilar del marco de AWS Well-Architected representa esta capacidad?", "o": ["Seguridad", "Eficiencia de rendimiento", "Optimización de costos", "Fiabilidad"], "a": [3], "e": "Incorrecto. El pilar de optimización de costos brinda la capacidad de ejecutar cargas de trabajo de la manera más rentable. Incorrecto. El pilar de eficiencia de rendimiento proporciona la capacidad de ejecutar cargas de trabajo de manera eficiente mediante el uso de los recursos correctos. Correcto. El pilar de fiabilidad brinda la capacidad de recuperarse de un error, incluso si se trata de un desastre natural. Incorrecto. El pilar de seguridad ofrece la capacidad de proteger las cargas de trabajo y sus datos en la nube.", "domain": "Conceptos de nube"}
];
const app=document.getElementById('app'),$=id=>document.getElementById(id),KEY='cloud-practice-v2';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db={prefs:{name:'',voice:'',rate:1,on:true},session:null,history:[]},timer=null;
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.prefs&&Array.isArray(saved.history))db=saved}catch{}
const groups={
'Conceptos de nube':[4,7,8,16,24,34,37,41,43,65],
'Seguridad y cumplimiento':[3,29,32,33,39,40,42,48,49,50,51,54,66,67,68,71,75,81],
'Facturación, precios y soporte':[1,13,17,20,38,52,53,62,69,72,76,79]};
Q.forEach((q,k)=>{q.id=k;q.domain=q.domain||Object.keys(groups).find(d=>groups[d].includes(k+1))||'Tecnología y servicios';});
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));$('storage').textContent='Avance e historial guardados en este navegador.'}catch{$('storage').textContent='No se pudo guardar: revisa el almacenamiento del navegador. Mantén esta página abierta.'}}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const correct=r=>r.sel.length===Q[r.id].a.length&&r.sel.every(x=>Q[r.id].a.includes(x));
const complete=r=>r.sel.length===Q[r.id].a.length;
const duration=s=>Math.max(0,Math.floor(((s.finished||Date.now())-s.started)/1000));
const clock=n=>Math.floor(Math.max(0,n)/60)+':'+String(Math.max(0,n)%60).padStart(2,'0');
const synth=window.speechSynthesis;
let speechToken=0;
function stop(){speechToken++;if(synth)synth.cancel();if($('voiceStatus'))$('voiceStatus').textContent='Audio detenido.'}
function speak(text){stop();if(!synth||!db.prefs.on){if($('voiceStatus'))$('voiceStatus').textContent='Activa la voz para escuchar.';return}const token=speechToken;const u=new SpeechSynthesisUtterance(text);u.lang='es-MX';u.voice=synth.getVoices().find(v=>v.name===db.prefs.voice)||synth.getVoices().find(v=>/^es/.test(v.lang))||null;u.rate=Number(db.prefs.rate);u.onstart=()=>{if(token===speechToken&&$('voiceStatus'))$('voiceStatus').textContent='Reproduciendo…'};u.onend=()=>{if(token===speechToken&&$('voiceStatus'))$('voiceStatus').textContent='Lectura terminada.'};u.onerror=()=>{if(token===speechToken&&$('voiceStatus'))$('voiceStatus').textContent='No se pudo reproducir el audio.'};synth.speak(u)}
function voiceButton(){$('vt').textContent=db.prefs.on?'🔊 Voz activada':'🔇 Voz desactivada';$('vt').setAttribute('aria-pressed',String(db.prefs.on));if(!synth){$('vt').disabled=true;$('vt').textContent='Voz no disponible'}}
$('vt').onclick=()=>{db.prefs.on=!db.prefs.on;stop();voiceButton();save()};voiceButton();
function frame(html){stop();clearInterval(timer);app.innerHTML=html;const heading=app.querySelector('h1,h2');if(heading){heading.tabIndex=-1;heading.focus()}window.scrollTo(0,0)}
function voices(){if(!$('voice'))return;const list=synth?synth.getVoices().filter(v=>/^es/.test(v.lang)):[];$('voice').innerHTML='<option value="">Automática (español)</option>'+list.map(v=>`<option value="${esc(v.name)}">${esc(v.name)}</option>`).join('');$('voice').value=db.prefs.voice}
if(synth)synth.onvoiceschanged=voices;
function home(){
const active=db.session&&!db.session.finished,history=db.history;
frame(`<div class="card"><span class="tag">Tu espacio de estudio</span><h1>Cloud Practitioner</h1><p class="mute">${Q.length} preguntas · práctica independiente de AWS</p>
${active?'<div class="fb ok"><strong>Tienes un intento pendiente</strong><p>Continúa con tus respuestas guardadas. El tiempo del modo examen sigue corriendo al cerrar la página.</p><button class="btn" id="resume">Continuar intento</button></div>':''}
<div class="set"><label>Tu nombre<input id="name" maxlength="30" value="${esc(db.prefs.name)}" placeholder="Opcional"></label>
<label>Modo<select id="mode"><option value="practice">Práctica · explicación al comprobar</option><option value="exam">Examen · resultados al finalizar</option></select></label>
<label>Cantidad de preguntas<select id="count">${[10,20,30,65,Q.length].map(n=>`<option value="${n}" ${n===65?'selected':''}>${n===Q.length?'Todas ('+n+')':n}</option>`).join('')}</select></label>
<label>Tema<select id="domain"><option value="all">Todos los temas</option>${[...new Set(Q.map(q=>q.domain))].map(d=>`<option>${d}</option>`).join('')}</select></label>
<label>Tiempo del examen (minutos)<input id="minutes" type="number" min="1" max="240" value="90"></label>
<label>Voz<select id="voice"></select></label><label>Velocidad<select id="rate">${[.75,1,1.25,1.5].map(r=>`<option value="${r}" ${r===Number(db.prefs.rate)?'selected':''}>${r}×</option>`).join('')}</select></label>
<button class="vb" id="testVoice">Probar voz</button><p id="voiceStatus" role="status"></p></div>
<p>Meta de práctica: 70 %. Este porcentaje no equivale a la puntuación escalada del examen oficial ni garantiza aprobarlo.</p><div class="act"><button class="btn" id="begin">Comenzar</button></div></div>
<section class="card section"><h2>Tu historial</h2>${history.length?`<p>Últimos ${history.length} intentos guardados en este navegador.</p><div class="history">${history.slice().reverse().map(h=>`<button class="historyRow" data-history="${h.uid}"><b>${h.score}% · ${h.mode==='exam'?'Examen':'Práctica'}</b><span>${new Date(h.finished).toLocaleString('es-MX')} · ${h.rows.length} preguntas · ${clock(duration(h))}</span></button>`).join('')}</div><h3>Preguntas que fallas con frecuencia</h3>${frequent()}`:'<p class="mute">Al terminar tu primer intento aparecerá aquí.</p>'}</section>`);
voices();$('minutes').disabled=true;$('mode').onchange=()=>{$('minutes').disabled=$('mode').value!=='exam'};
for(const [id,key] of [['name','name'],['voice','voice'],['rate','rate']])$(id).onchange=()=>{db.prefs[key]=$(id).value;save()};
$('testVoice').onclick=()=>{db.prefs.on=true;voiceButton();save();speak('Hola '+db.prefs.name+'. Soy Nube, tu asistente de estudio.')};
if(active)$('resume').onclick=()=>{if(!expired())show()};
$('begin').onclick=()=>{const minutes=Number($('minutes').value);if($('mode').value==='exam'&&(!Number.isInteger(minutes)||minutes<1||minutes>240)){alert('Elige entre 1 y 240 minutos.');return}if(active&&!confirm('¿Reemplazar el intento pendiente por uno nuevo?'))return;const pool=Q.filter(q=>$('domain').value==='all'||q.domain===$('domain').value);launch(shuffle(pool.map(q=>q.id)).slice(0,Number($('count').value)),$('mode').value,minutes)};
app.querySelectorAll('[data-history]').forEach(b=>b.onclick=()=>results(db.history.find(h=>h.uid===b.dataset.history)));
}
function frequent(){const tally={};db.history.forEach(h=>h.rows.forEach(r=>{if(!correct(r))tally[r.id]=(tally[r.id]||0)+1}));return Object.entries(tally).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([id,n])=>`<p>${esc(Q[id].t)} <b>(${n} ${n===1?'error':'errores'})</b></p>`).join('')||'<p>¡Todavía no tienes errores!</p>'}
function launch(ids,mode='practice',minutes=90){const now=Date.now();db.session={uid:String(now)+'-'+Math.random().toString(36).slice(2),mode,started:now,deadline:mode==='exam'?now+minutes*60000:null,index:0,rows:ids.map(id=>({id,order:shuffle(Q[id].o.map((_,k)=>k)),sel:[],checked:false,flag:false}))};save();show()}
function expired(){const s=db.session;if(s&&!s.finished&&s.deadline&&Date.now()>=s.deadline){finish(true);return true}return false}
function tick(){if(expired())return;const s=db.session;if($('time'))$('time').textContent=s.deadline?'Restante: '+clock(Math.ceil((s.deadline-Date.now())/1000)):'Tiempo: '+clock(duration(s))}
function show(){if(expired())return;const s=db.session,r=s.rows[s.index],q=Q[r.id],locked=s.mode==='practice'&&r.checked;
frame(`<div class="top"><span>Pregunta ${s.index+1} de ${s.rows.length} · ${s.mode==='exam'?'Examen':'Práctica'}</span><span id="time"></span></div><progress max="${s.rows.length}" value="${s.rows.filter(complete).length}" aria-label="Preguntas respondidas"></progress><div class="card"><span class="tag">${q.domain}</span><h2>${esc(q.t)}</h2><p>${q.a.length>1?'Selecciona '+q.a.length+' respuestas.':'Selecciona una respuesta.'}</p><div class="opts">${r.order.map((k,j)=>`<label class="opt ${r.sel.includes(k)?'on':''} ${locked&&q.a.includes(k)?'right':''} ${locked&&r.sel.includes(k)&&!q.a.includes(k)?'wrong':''}"><input type="${q.a.length>1?'checkbox':'radio'}" name="answer" value="${k}" ${r.sel.includes(k)?'checked':''} ${locked?'disabled':''}><span class="l">${'ABCDE'[j]}.</span><span>${esc(q.o[k])}</span></label>`).join('')}</div>
<div class="act"><button class="vb" id="flag" aria-pressed="${r.flag}">${r.flag?'★ Marcada con duda':'☆ Tengo dudas'}</button><button class="vb" id="read">Leer pregunta y opciones</button><button class="vb" id="stop">Detener voz</button></div><p id="voiceStatus" role="status"></p>
${locked?feedback(r)+'<button class="vb" id="explainVoice">Escuchar explicación</button>':''}<div class="act">${s.mode==='practice'&&!locked?'<button class="btn" id="check" '+(!complete(r)?'disabled':'')+'>Comprobar</button>':''}</div>
<div class="act"><button class="btn sec" id="prev" ${s.index===0?'disabled':''}>Anterior</button><button class="btn sec" id="next" ${s.index===s.rows.length-1?'disabled':''}>Siguiente</button><button class="btn" id="finish">Finalizar intento</button></div></div>
<section class="card section"><h2>Panel de preguntas</h2><p class="mute">○ Pendiente · ● Respondida · ★ Con duda</p><div class="questionGrid">${s.rows.map((row,i)=>`<button class="navq ${i===s.index?'current':''}" data-index="${i}" aria-label="Pregunta ${i+1}, ${row.flag?'con duda, ':''}${complete(row)?'respondida':'pendiente'}" ${i===s.index?'aria-current="step"':''}>${row.flag?'★':complete(row)?'●':'○'} ${i+1}</button>`).join('')}</div><div class="act"><button class="vb" id="home">Guardar y volver al inicio</button></div></section>`);
app.querySelectorAll('input[name=answer]').forEach(input=>input.onchange=()=>{if(expired())return;r.sel=[...app.querySelectorAll('input[name=answer]:checked')].map(x=>Number(x.value));save();app.querySelectorAll('.opt').forEach(el=>el.classList.toggle('on',el.querySelector('input').checked));if($('check'))$('check').disabled=!complete(r);app.querySelector('progress').value=s.rows.filter(complete).length;const b=app.querySelector(`[data-index="${s.index}"]`);b.textContent=(r.flag?'★':complete(r)?'●':'○')+' '+(s.index+1);b.setAttribute('aria-label',`Pregunta ${s.index+1}, ${r.flag?'con duda, ':''}${complete(r)?'respondida':'pendiente'}`)});
$('flag').onclick=()=>{if(expired())return;r.flag=!r.flag;save();show()};$('read').onclick=()=>speak(q.t+' '+r.order.map((k,j)=>'Opción '+'ABCDE'[j]+'. '+q.o[k]+'.').join(' '));$('stop').onclick=stop;
if($('check'))$('check').onclick=()=>{if(expired()||!complete(r))return;r.checked=true;save();show();if(!correct(r))speak('La respuesta correcta es '+q.a.map(k=>q.o[k]).join(' y ')+'. '+q.e)};
if($('explainVoice'))$('explainVoice').onclick=()=>speak(q.e);
function go(n){if(expired())return;s.index=n;save();show()}
$('prev').onclick=()=>go(s.index-1);$('next').onclick=()=>go(s.index+1);app.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>go(Number(b.dataset.index)));
$('finish').onclick=()=>{if(expired())return;const left=s.rows.filter(r=>!complete(r)).length;if(confirm(`¿Finalizar el intento? ${left?left+' preguntas están pendientes o incompletas y contarán como incorrectas.':'Podrás revisar todas las explicaciones.'}`))finish(false)};
$('home').onclick=()=>{save();home()};tick();timer=setInterval(tick,1000)
}
function feedback(r){const q=Q[r.id];return `<div class="fb ${correct(r)?'ok':'no'}" role="status"><strong>${correct(r)?'✓ Correcto':'✗ Incorrecto'}</strong><p><b>Tu respuesta:</b> ${r.sel.length?r.sel.map(k=>esc(q.o[k])).join(' / '):'Sin responder'}</p><p><b>Correcta:</b> ${q.a.map(k=>esc(q.o[k])).join(' / ')}</p><p>${esc(q.e)}</p></div><details><summary>Analizar las opciones incorrectas</summary><p>Compara cada alternativa con el requisito del enunciado y la explicación:</p>${q.o.map((o,k)=>q.a.includes(k)?'':`<p><b>${esc(o)}</b>: ${esc(reason(q,o))}</p>`).join('')}</details>`}
function reason(q,o){const roles=[[/Pricing Calculator|Calculadora de precios/i,'estima costos antes del despliegue'],[/Cost Explorer/i,'analiza costos y uso'],[/AWS Backup/i,'centraliza copias de seguridad'],[/AWS Artifact/i,'proporciona informes y acuerdos de cumplimiento'],[/AWS Shield/i,'protege contra DDoS'],[/AWS WAF/i,'filtra solicitudes web'],[/CloudTrail/i,'registra eventos y actividad de API'],[/CloudWatch/i,'recopila métricas, registros y alarmas'],[/AWS Config/i,'registra configuraciones y evalúa reglas'],[/GuardDuty/i,'detecta amenazas'],[/Inspector/i,'evalúa vulnerabilidades'],[/Detective/i,'ayuda a investigar eventos de seguridad'],[/Macie/i,'descubre datos sensibles en S3'],[/Amazon S3$/i,'almacena objetos'],[/Amazon EBS/i,'proporciona almacenamiento en bloque'],[/Amazon EFS/i,'ofrece un sistema de archivos compartido'],[/DynamoDB/i,'es una base de datos NoSQL'],[/Amazon Aurora/i,'es una base de datos relacional compatible con MySQL y PostgreSQL'],[/Amazon RDS/i,'administra bases de datos relacionales'],[/Redshift/i,'se utiliza para análisis en un almacén de datos'],[/Neptune/i,'es una base de datos de grafos'],[/AWS Lambda/i,'ejecuta código por eventos sin administrar servidores'],[/AWS Fargate/i,'ejecuta contenedores sin administrar servidores'],[/Amazon EC2$/i,'ofrece máquinas virtuales'],[/Amazon SQS/i,'proporciona colas de mensajes'],[/Amazon SNS/i,'distribuye mensajes a suscriptores'],[/AWS Secrets Manager/i,'administra secretos de aplicaciones'],[/AWS KMS|Key Management/i,'administra claves de cifrado'],[/AWS Budgets/i,'define presupuestos y alertas'],[/Route 53/i,'ofrece DNS y políticas de enrutamiento']];const match=roles.find(([rx])=>rx.test(o));return match?`Esta opción ${match[1]}; no es la respuesta que cumple lo solicitado en este escenario. ${q.e}`:`No es una de las respuestas correctas para este escenario. La distinción es: ${q.e}`}
function finish(timeout){const s=db.session;if(!s||s.finished)return;s.finished=timeout?s.deadline:Date.now();s.timeout=timeout;s.score=Math.round(s.rows.filter(correct).length/s.rows.length*100);db.history.push(JSON.parse(JSON.stringify(s)));db.history=db.history.slice(-50);save();results(s)}
function results(s){const errors=s.rows.filter(r=>!correct(r)),doubts=s.rows.filter(r=>r.flag),topics=[...new Set(s.rows.map(r=>Q[r.id].domain))];
frame(`<div class="card"><span class="tag">${s.mode==='exam'?'Examen':'Práctica'} terminado</span><h1>${s.score}% de aciertos</h1><p>${esc(db.prefs.name?db.prefs.name+', ':'')}${s.rows.length-errors.length} correctas de ${s.rows.length} · ${clock(duration(s))}${s.timeout?' · Tiempo agotado':''}</p><p>${s.rows.filter(correct).length/s.rows.length>=.7?'Alcanzaste la meta de práctica.':'Sigue practicando para alcanzar la meta del 70 %.'} Este resultado no equivale a la puntuación oficial de AWS.</p><h2>Resultados por tema</h2><div class="tableWrap"><table><thead><tr><th>Tema</th><th>Aciertos</th><th>Porcentaje</th></tr></thead><tbody>${topics.map(d=>{const rows=s.rows.filter(r=>Q[r.id].domain===d),good=rows.filter(correct).length;return `<tr><td>${d}</td><td>${good}/${rows.length}</td><td>${Math.round(good/rows.length*100)}%</td></tr>`}).join('')}</tbody></table></div><div class="act"><button class="btn" id="retry" ${errors.length?'':'disabled'}>Practicar errores (${errors.length})</button><button class="btn sec" id="doubts" ${doubts.length?'':'disabled'}>Repasar dudas (${doubts.length})</button><button class="btn sec" id="back">Inicio e historial</button></div></div>
<section class="card section"><h2>Revisión de respuestas</h2><label>Mostrar <select id="reviewFilter"><option value="all">Todas</option><option value="errors">Solo errores</option><option value="flags">Con dudas</option></select></label><div id="review"></div></section>`);
function review(){const filter=$('reviewFilter').value;$('review').innerHTML=s.rows.filter(r=>filter==='all'||(filter==='errors'&&!correct(r))||(filter==='flags'&&r.flag)).map(r=>`<article class="ri"><h3>${r.flag?'★ ':''}${esc(Q[r.id].t)}</h3>${feedback(r)}</article>`).join('')||'<p>No hay preguntas en este filtro.</p>'}review();$('reviewFilter').onchange=review;
function retry(rows){if(db.session&&!db.session.finished&&!confirm('¿Reemplazar el intento pendiente por este repaso?'))return;launch(shuffle(rows.map(r=>r.id)))}$('retry').onclick=()=>retry(errors);$('doubts').onclick=()=>retry(doubts);$('back').onclick=home
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&db.session&&!db.session.finished)expired()});
window.addEventListener('pagehide',stop);save();home();

}
</script>
</body>
</html>
